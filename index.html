<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KB Global One Team News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0a1628;
      --ink: #ffffff;
      --kb: #F39200;
      --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(26, 60, 120, .45), transparent 55%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(243, 146, 0, .12), transparent 50%),
        var(--navy);
      min-height: 100%;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .box {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #00e5c3;
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-size: clamp(36px, 8vw, 72px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .kb { color: var(--kb); }
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 360px;
      margin: 0 auto;
    }
    .links a {
      position: relative;
      z-index: 0;
      isolation: isolate;
      display: block;
      text-decoration: none;
      color: #fff;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .06em;
      border-radius: 999px;
      background:
        radial-gradient(1px 1px at 14% 32%, rgba(255,255,255,.45), transparent 80%),
        radial-gradient(1px 1px at 68% 24%, rgba(255,255,255,.32), transparent 80%),
        linear-gradient(180deg, rgba(12, 16, 32, .98) 0%, rgba(4, 6, 16, 1) 100%);
      text-shadow:
        0 0 8px rgba(217, 70, 239, .95),
        0 0 16px rgba(139, 92, 246, .85),
        0 0 24px rgba(59, 130, 246, .75);
      transition: transform .2s ease, filter .2s ease;
    }
    .links a::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
      padding: 1.5px;
      background: linear-gradient(90deg, #e879f9 0%, #a855f7 18%, #6366f1 38%, #3b82f6 58%, #22d3ee 78%, #c084fc 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    .links a:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }
    .links a span {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="box">
      <p class="tag">WORLD INTELLIGENCE · ONE TEAM</p>
      <h1><span class="kb">KB</span> GLOBAL<br>ONE TEAM NEWS</h1>
      <nav class="links" aria-label="화면 선택">
        <a href="https://kb-global-daily.pages.dev/topics" target="_blank" rel="noopener noreferrer"><span>1안</span></a>
        <a href="https://kidali77.github.io/mywork/#brief" target="_blank" rel="noopener noreferrer"><span>2안</span></a>
        <a href="index1.html" target="_blank" rel="noopener noreferrer"><span>3안</span></a>
        <a href="index2.html" target="_blank" rel="noopener noreferrer"><span>4안</span></a>
      </nav>
    </div>
  </main>
</body>
</html>
