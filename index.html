}

}
.gs-lang button.on { background: var(--blue); border-color: var(--blue); }
.gs-theme-switch {
  width: 40px; height: 22px; border-radius: 11px; border: 1px solid #dcdfe6;
  background: #f2f2f2; padding: 0; cursor: pointer; position: relative; flex-shrink: 0;
  transition: background .35s cubic-bezier(.4,0,.2,1), border-color .35s cubic-bezier(.4,0,.2,1);
}
.gs-theme-switch.dark {
  background: #141414; border-color: #4c4d4f;
}
.gs-theme-switch__knob {
  position: absolute; top: 1px; left: 1px; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12);
  display: grid; place-items: center;
  transition: transform .35s cubic-bezier(.4,0,.2,1);
}
.gs-theme-switch.dark .gs-theme-switch__knob { transform: translateX(18px); }
.gs-theme-icon {
  width: 12px; height: 12px; position: absolute; color: #606266;
  transition: opacity .28s ease, transform .35s cubic-bezier(.4,0,.2,1);
}
.gs-theme-switch.dark .gs-theme-icon { color: #cfd3dc; }
.gs-theme-icon--sun { opacity: 1; transform: rotate(0deg) scale(1); }
.gs-theme-icon--moon { opacity: 0; transform: rotate(-25deg) scale(.75); }
.gs-theme-switch.dark .gs-theme-icon--sun { opacity: 0; transform: rotate(25deg) scale(.75); }
.gs-theme-switch.dark .gs-theme-icon--moon { opacity: 1; transform: rotate(0deg) scale(1); }
::view-transition-old(root),
::view-transition-new(root) {
  animation: none;
  mix-blend-mode: normal;
}
html[data-theme-transition="to-light"]::view-transition-new(root) { z-index: 2147483646; }
html[data-theme-transition="to-light"]::view-transition-old(root) { z-index: 1; }
html[data-theme-transition="to-dark"]::view-transition-old(root) { z-index: 2147483646; }
html[data-theme-transition="to-dark"]::view-transition-new(root) { z-index: 1; }

const pulseKey = () => `kb-pulse-${WEEK_ID}`

const loadPulse = () => { try { return JSON.parse(localStorage.getItem(pulseKey()) || '{}') } catch (_) { return {} } }

const pulseTotals = () => {
  const t = { hot: PULSE_DEMO.hot, normal: PULSE_DEMO.normal, cold: PULSE_DEMO.cold }

}
const fmtTime = (tz) => {

}

function renderPulseSummaryOnly() {
  const totals = pulseTotals(), sum = totals.hot + totals.normal + totals.cold, t = TX[LANG]
  const spectrum = PULSE_LEVELS.map(l => {
    const pct = sum ? Math.round(totals[l.id] / sum * 100) : 0
    return `<div class="gs-spec-seg" style="width:${pct}%;background:${l.color}"></div>`
  }).join('')
  const legend = PULSE_LEVELS.map(l => {
    const pct = sum ? Math.round(totals[l.id] / sum * 100) : 0
    return `<span>${l.emoji} ${pct}%</span>`
  }).join('')
  return `<div class="gs-psum"><div style="font-size:10px;margin-bottom:6px">${t.pulseSummaryTitle} · ${sum} votes</div>

function closeAllClockPickers() {
  const strip = document.getElementById('clockStrip'); if (!strip) return
  strip.querySelectorAll('.gs-clk-picker').forEach(p => { p.hidden = true })
  strip.querySelectorAll('.gs-clk').forEach(c => c.classList.remove('is-open'))
}

function bindClockPulseEvents() {
  const strip = document.getElementById('clockStrip'); if (!strip) return
  strip.onclick = (e) => {
    const opt = e.target.closest('.gs-clk-opt')
    if (opt) {
      e.stopPropagation()
      savePulse(opt.closest('.gs-clk').dataset.country, opt.dataset.level)
      closeAllClockPickers(); updateClockUI(); return
    }
    const clk = e.target.closest('.gs-clk'); if (!clk) return
    const picker = clk.querySelector('.gs-clk-picker'), willOpen = picker.hidden
    closeAllClockPickers()
    if (willOpen) { clk.classList.add('is-open'); picker.hidden = false }
    e.stopPropagation()
  }
}

function updateClockUI() {
  const strip = document.getElementById('clockStrip'), summary = document.getElementById('pulseSummary')
  if (strip) strip.innerHTML = renderClockStrip()
  if (summary) summary.innerHTML = renderPulseSummaryOnly()
  bindClockPulseEvents()
}

function getScrollEl() { return document.getElementById('gsScroll') }

function scrollToSection(id, tabIndex) {
  activeSection = id
  if (tabIndex != null) activeTabIndex = tabIndex
  else {
    const idx = TX[LANG].tabIds.indexOf(id)
    activeTabIndex = idx >= 0 ? idx : 0
  }
  renderNav(); renderDots()
  const el = document.getElementById('section-' + id)
  const sc = getScrollEl()
  if (!el || !sc) return
  var top = el.offsetTop
  if (sc.scrollTo) sc.scrollTo({ top: top, behavior: motionOff.value ? 'auto' : 'smooth' })
  else sc.scrollTop = top
}

function setupScrollSpy() {
  if (spyIO && spyIO.disconnect) spyIO.disconnect()
  const sc = getScrollEl(); if (!sc) return
  if (!window.IntersectionObserver) return
  spyIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        activeSection = e.target.id.replace('section-', '')
        const idx = TX[LANG].tabIds.indexOf(activeSection)
        activeTabIndex = idx >= 0 ? idx : 0
        renderNav(); renderDots()
        headerSolid.value = activeSection !== 'hero'
      }
    })
  }, { root: sc, threshold: 0.45 })
  SECTION_IDS.forEach(function (id) {
    const el = document.getElementById('section-' + id)
    if (el) spyIO.observe(el)
  })
}

function navButtonsHTML() {
  const t = TX[LANG]
  return t.tabs.map((tab, i) => {
    const id = t.tabIds[i]
    return `<button type="button" data-section="${id}" data-tab-index="${i}" class="gs-nav-btn ${i === activeTabIndex ? 'active' : ''}">${tab}</button>`
  }).join('')
}

function renderNav() {
  const html = navButtonsHTML()
  const mainNav = document.getElementById('mainNav')
  const footerNav = document.getElementById('footerNav')
  ;[mainNav, footerNav].forEach(nav => {
    if (!nav) return
    nav.innerHTML = html
    nav.onclick = (e) => {
      const btn = e.target.closest('button[data-section]')
      if (btn) scrollToSection(btn.dataset.section, +btn.dataset.tabIndex)
    }
  })
}

function renderDots() {
  const box = document.getElementById('pageDots'); if (!box) return
  box.innerHTML = SECTION_IDS.map(id =>
    `<button type="button" class="gs-dot ${id === activeSection ? 'on' : ''}" data-section="${id}" aria-label="${id}"></button>`
  ).join('')
  box.onclick = (e) => {
    const b = e.target.closest('.gs-dot')
    if (b) scrollToSection(b.dataset.section)
  }
}

function renderDock() {
  const t = TX[LANG], box = document.getElementById('gsDock'); if (!box) return
  box.innerHTML = t.dock.map(d =>

  ).join('')
  box.onclick = (e) => {
    const b = e.target.closest('.gs-dock-item')
    if (b) scrollToSection(b.dataset.section)
  }
}

function updateMediaCarousel(wheeling) {
  const t = TX[LANG], cards = document.querySelectorAll('.gs-media-card')
  const total = t.mediaCards.length
  if (!cards.length) return
  const track = document.getElementById('mediaCoverflowTrack')
  if (track) track.classList.toggle('is-wheeling', !!wheeling)
  const spacing = 240, angle = 48
  cards.forEach((card, i) => {
    const offset = i - mediaCarouselOffset
    const abs = Math.abs(offset)
    const tx = offset * spacing
    const ry = offset * -angle
    const scale = abs < 0.5 ? 1 - abs * 0.08 : Math.max(0.62, 1 - abs * 0.14)
    const tz = abs < 0.5 ? 120 - abs * 80 : -abs * 55
    card.style.transform = `translateX(${tx}px) translateZ(${tz}px) rotateY(${ry * Math.min(1, abs)}deg) scale(${scale})`
    card.style.zIndex = String(100 - Math.round(abs))
    card.style.opacity = abs > 4 ? '0' : String(Math.max(0.35, 1 - abs * 0.12))
    card.style.pointerEvents = abs > 4 ? 'none' : 'auto'
    card.classList.toggle('is-active', abs < 0.5)
  })
  mediaCarouselIndex = Math.max(0, Math.min(total - 1, Math.round(mediaCarouselOffset)))
  const counter = document.getElementById('mediaCounter')
  if (counter) counter.textContent = `${mediaCarouselIndex + 1} / ${total}`
  const prev = document.getElementById('mediaPrev')
  const next = document.getElementById('mediaNext')
  if (prev) prev.disabled = mediaCarouselOffset <= 0.01
  if (next) next.disabled = mediaCarouselOffset >= total - 1.01
}

function snapMediaCarouselTo(target) {
  if (mediaSnapAnim) cancelAnimationFrame(mediaSnapAnim)
  const start = mediaCarouselOffset
  const startTime = performance.now()
  const duration = 380
  const track = document.getElementById('mediaCoverflowTrack')
  if (track) track.classList.remove('is-wheeling')
  function frame(now) {
    const p = Math.min(1, (now - startTime) / duration)
    const ease = 1 - Math.pow(1 - p, 3)
    mediaCarouselOffset = start + (target - start) * ease
    updateMediaCarousel(false)
    if (p < 1) mediaSnapAnim = requestAnimationFrame(frame)
    else {
      mediaCarouselOffset = target
      mediaCarouselIndex = target
      mediaSnapAnim = null
      updateMediaCarousel(false)
    }
  }
  mediaSnapAnim = requestAnimationFrame(frame)
}

function snapMediaCarousel() {
  snapMediaCarouselTo(Math.max(0, Math.min(TX[LANG].mediaCards.length - 1, Math.round(mediaCarouselOffset))))
}

function moveMediaCarousel(dir) {
  const total = TX[LANG].mediaCards.length
  const target = Math.max(0, Math.min(total - 1, mediaCarouselIndex + dir))
  snapMediaCarouselTo(target)
}

function bindMediaCarousel() {
  const section = document.getElementById('section-media')
  const track = document.getElementById('mediaCoverflowTrack')
  if (!section || !track || section.dataset.bound) return
  section.dataset.bound = '1'
  section.addEventListener('wheel', (e) => {
    if (activeSection !== 'media') return
    e.preventDefault()
    if (mediaSnapAnim) { cancelAnimationFrame(mediaSnapAnim); mediaSnapAnim = null }
    const total = TX[LANG].mediaCards.length
    mediaCarouselOffset += e.deltaY * MEDIA_WHEEL_SENS
    mediaCarouselOffset = Math.max(0, Math.min(total - 1, mediaCarouselOffset))
    updateMediaCarousel(true)
    clearTimeout(mediaWheelEndTimer)
    mediaWheelEndTimer = setTimeout(snapMediaCarousel, 140)
  }, { passive: false })
  track.addEventListener('click', (e) => {
    const card = e.target.closest('.gs-media-card')
    if (!card) return
    const idx = +card.dataset.index
    if (idx === mediaCarouselIndex) showDrawer('media', idx)
    else snapMediaCarouselTo(idx)
  })
  document.getElementById('mediaPrev')?.addEventListener('click', () => moveMediaCarousel(-1))
  document.getElementById('mediaNext')?.addEventListener('click', () => moveMediaCarousel(1))
}

function applyColorMode() {
  document.documentElement.classList.toggle('gs-light', colorMode.value === 'light')
  try { localStorage.setItem('gs-color-mode', colorMode.value) } catch (_) {}
}

function toggleColorMode(event) {
  const next = colorMode.value === 'light' ? 'dark' : 'light'
  const goingDark = next === 'dark'
  const apply = () => {
    colorMode.value = next
    applyColorMode()
  }
  if (!document.startViewTransition || !event) {
    apply()
    return
  }
  const root = document.documentElement
  const x = event.clientX
  const y = event.clientY
  const endRadius = Math.hypot(
    Math.max(x, window.innerWidth - x),
    Math.max(y, window.innerHeight - y)
  )
  root.dataset.themeTransition = goingDark ? 'to-dark' : 'to-light'
  const animBase = { duration: 450, fill: 'forwards' }
  const expand = [
    `circle(0px at ${x}px ${y}px)`,
    `circle(${endRadius}px at ${x}px ${y}px)`
  ]
  const shrink = [
    `circle(${endRadius}px at ${x}px ${y}px)`,
    `circle(0px at ${x}px ${y}px)`
  ]
  const fullyOpenClip = [
    `circle(${endRadius}px at ${x}px ${y}px)`,
    `circle(${endRadius}px at ${x}px ${y}px)`
  ]
  const transition = document.startViewTransition(apply)
  transition.ready.then(() => {
    if (goingDark) {
      root.animate(
        { clipPath: shrink },
        { ...animBase, easing: 'ease-out', pseudoElement: '::view-transition-old(root)' }
      )
      root.animate(
        { clipPath: fullyOpenClip },
        { ...animBase, easing: 'linear', pseudoElement: '::view-transition-new(root)' }
      )
    } else {
      root.animate(
        { clipPath: expand },
        { ...animBase, easing: 'ease-in', pseudoElement: '::view-transition-new(root)' }
      )
      root.animate(
        { clipPath: fullyOpenClip },
        { ...animBase, easing: 'linear', pseudoElement: '::view-transition-old(root)' }
      )
    }
  }).catch(() => {})
  transition.finished.finally(() => {
    delete root.dataset.themeTransition
  })
}

                <img class="gs-hero-fallback" :src="heroFallbackImg" alt="KB Global One Team" />
              </div>
              <div class="gs-hero-inner">
                <div class="gs-hero-box">
                  <p class="gs-hero-tag" id="heroTagline">WORLD INTELLIGENCE · ONE TEAM</p>
                  <h1 id="heroTitle"><span class="gs-hero-kb">KB</span> GLOBAL<br>ONE TEAM</h1>
                  <button type="button" class="gs-hero-cta" @click="scrollToSection('business')">READ MORE</button>
                </div>
              </div>
            </section>

            <section id="section-trends" class="gs-fp gs-trends">
              <div class="gs-trends-inner">
                <h2 id="trendsTitle" class="gs-trends-page-title">글로벌 동향</h2>
                <div class="gs-trends-focus">
                  <div class="gs-trends-focus-main">
                    <span id="trendsFocusLabel" class="gs-trends-label gs-trends-label--gold">주간 초점</span>
                    <h3 id="trendsFocusTitle" class="gs-trends-focus-title">엔화 146 시대의 도래 · 아시아 금융 재편 시작</h3>
                    <p id="trendsFocusDesc" class="gs-trends-focus-desc"></p>
                    <div id="trendsFocusTags" class="gs-trends-tags"></div>
                  </div>
                  <div class="gs-trends-focus-action">
                    <span id="trendsActionLabel" class="gs-trends-label gs-trends-label--gold">KB 액션</span>
                    <ol id="trendsActionList" class="gs-trends-action-list"></ol>
                  </div>
                </div>
                <div class="gs-trends-kpi">
                  <article class="gs-trends-kpi-card gs-trends-kpi-card--shock">
                    <span id="trendsShockLabel" class="gs-trends-kpi-label">이 주의 충격</span>
                    <div id="trendsShockValue" class="gs-trends-kpi-value">5.75%</div>
                    <div id="trendsShockSub" class="gs-trends-kpi-sub">BI-Rate 5.75% ▲</div>
                    <p id="trendsShockDesc" class="gs-trends-kpi-desc"></p>
                  </article>
                  <article class="gs-trends-kpi-card gs-trends-kpi-card--var">
                    <span id="trendsVarLabel" class="gs-trends-kpi-label">이 주의 변수</span>
                    <div id="trendsVarValue" class="gs-trends-kpi-value">3.50-3.75%</div>
                    <div id="trendsVarSub" class="gs-trends-kpi-sub">Fed 기준금리 3.50-3.75%</div>
                    <p id="trendsVarDesc" class="gs-trends-kpi-desc"></p>
                  </article>
                </div>
                <div class="gs-trends-signals-hd">
                  <h3 id="trendsSignalsTitle">4대 시장신호</h3>
                  <p id="trendsSignalsHint"></p>
                </div>
                <div id="trendsSignalsGrid" class="gs-trends-signals-grid"></div>
              </div>
            </section>

            <section id="section-media" class="gs-fp gs-media">
              <div class="gs-media-inner">
                <div class="gs-media-hd">
                  <h2 id="mediaTitle" class="gs-media-title">현지언론</h2>
                  <p id="mediaDesc" class="gs-media-desc"></p>
                  <p id="mediaHint" class="gs-media-hint"></p>
                </div>
                <div class="gs-media-carousel">
                  <button type="button" id="mediaPrev" class="gs-media-arrow gs-media-arrow--prev" aria-label="Previous">&lt;</button>
                  <div class="gs-media-carousel-stage">
                    <div id="mediaCoverflowTrack" class="gs-media-carousel-track"></div>
                  </div>
                  <button type="button" id="mediaNext" class="gs-media-arrow gs-media-arrow--next" aria-label="Next">&gt;</button>
                </div>
                <div class="gs-media-counter-wrap">
                  <span id="mediaCounter" class="gs-media-counter">1 / 10</span>
                </div>
              </div>
            </section>

            <section id="section-business" class="gs-fp gs-business">
              <div class="gs-business-bg"></div>
              <div class="gs-business-inner"><div id="bizGrid" class="gs-biz-grid"></div></div>
            </section>

            <section id="section-network" class="gs-fp gs-network">
              <div class="gs-network-bg"></div>
              <div class="gs-network-inner">
                <div class="gs-map-wrap">
                  <svg class="gs-map-svg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
                    <path fill="rgba(255,255,255,.08)" d="M150,120 Q200,80 280,100 T420,90 T580,110 T720,95 T850,120 L880,200 Q820,240 700,220 T480,230 T260,210 T120,190 Z"/>
                    <path fill="rgba(255,255,255,.06)" d="M80,280 Q180,260 320,270 T560,265 T780,275 T920,290 L900,380 Q750,400 550,390 T250,385 T100,360 Z"/>
                  </svg>
                  <div id="mapDots"></div>
                </div>
                <div class="gs-network-box">
                  <h2 id="networkTitle">Global Network</h2>
                  <p id="networkDesc"></p>
                  <div class="gs-pulse-zone">
                    <p class="gs-pulse-hint" id="clockHint"></p>
                    <div id="clockStrip" class="gs-clocks"></div>
                    <div id="pulseSummary"></div>
                  </div>
                </div>
              </div>
            </section>

            <section id="section-news" class="gs-fp gs-news">
              <div class="gs-news-inner">
                <div class="gs-news-card">
                  <div class="gs-news-head">
                    <div class="gs-news-title">News</div>
                    <div id="newsList" class="gs-news-list"></div>
                  </div>
                  <div class="gs-news-nav">
                    <button type="button" @click="scrollToSection('hub')">‹</button>
                    <button type="button" @click="scrollToSection('hub')">›</button>
                  </div>
                </div>
              </div>
            </section>

            <section id="section-hub" class="gs-fp gs-hub">
              <div class="gs-hub-inner">
                <div class="gs-hub-hd">
                  <h2 id="hubTitle">Intelligence Hub</h2>
                  <p id="hubDesc"></p>
                </div>
                <div class="gs-hub-grid">
                  <div class="gs-panel">
                    <h3>Local Media</h3>
                    <div class="gs-filters" id="mediaFilters">
                      <button class="active" data-f="all">{{ lang === 'ko' ? '전체' : 'All' }}</button>
                      <button data-f="esg">ESG</button>
                    </div>
                    <div id="localMediaFeed"></div>
                  </div>
                  <div class="gs-panel">
                    <h3>Subsidiaries & Topics</h3>
                    <div class="gs-tiles" id="hubSubs"></div>
                    <div class="gs-tiles" id="hubTopics" style="margin-top:10px"></div>
                  </div>
                  <div class="gs-panel">
                    <h3>Regulation</h3>
                    <div class="gs-faq" id="hubRegs"></div>
                  </div>
                  <div class="gs-panel">
                    <h3>{{ lang === 'ko' ? '참여 코너' : 'Engagement' }}</h3>
                    <div id="funChoiceBox" class="gs-fun-grid"></div>
                  </div>
                </div>
              </div>
            </section>

            <footer class="gs-footer">
              <div class="gs-footer-inner">
                <nav id="footerNav" class="gs-footer-links"></nav>
                <p class="gs-footer-info" id="footerAddr"></p>
                <p class="gs-footer-copy" id="footerText"></p>
                <select class="gs-family"><option>FAMILY SITE</option><option>KB Financial Group</option><option>KB Global Network</option></select>
              </div>
            </footer>
          </div>

          <div id="drawer" class="gs-drawer" :class="{ on: drawerOpen }" @click.self="closeDrawer">
            <aside class="gs-drawer-panel" role="dialog" aria-modal="true">
              <div class="gs-drawer-head">
                <button type="button" class="gs-drawer-x" @click="closeDrawer" :aria-label="drawerCloseLabel()">✕</button>
              </div>
              <div id="drawer-img-wrap" class="gs-drawer-img"></div>
              <div class="gs-drawer-body">
                <div id="drawer-tag" class="gs-drawer-tag"></div>
                <h2 id="drawer-title" class="gs-drawer-title"></h2>
                <div id="drawer-detail" class="gs-drawer-prose"></div>
                <div id="drawer-insight" class="gs-drawer-insight"></div>
                <div id="drawer-sources"></div>
              </div>
            </aside>
          </div>
        </div>
      `
    }).mount('#app')
  </script>
</body>
</html>
